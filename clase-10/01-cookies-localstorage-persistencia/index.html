<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persistencia (Cookies, LocalStorage, SessionStorage)</title>
</head>

<body>

  <body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-2xl">

      <h1 class="text-2xl font-bold text-slate-800 mb-6">
        Carga de nombres
      </h1>

      <form id="formulario" class="space-y-4">

        <div class="flex items-center gap-4">

          <label for="nombre" class="w-28 text-sm font-semibold text-slate-700">
            Nombre
          </label>

          <input id="nombre" type="text" placeholder="Ingrese un nombre..." class="flex-1 rounded-lg border border-slate-300 px-4 py-2.5
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500 transition">

          <button type="submit" class="bg-blue-600 hover:bg-blue-700
                           text-white font-medium
                           px-6 py-2.5 rounded-lg
                           transition duration-200 cursor-pointer">
            Agregar
          </button>

        </div>

      </form>

    </div>

  </body>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
