<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag and Drop Binarios</title>
  </head>
  <body>

    <form
  id="formulario"
  class="mt-8 max-w-md mx-auto p-6 bg-white rounded-2xl shadow-lg border border-gray-200 space-y-5"
>

  <small id="errores" class=" text-red-600"></small>

  <input
    type="text"
    name="nombre"
    placeholder="Nombre"
    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
  >

  <input
    type="email"
    name="email"
    placeholder="Email"
    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
  >

  <button
    type="submit"
    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 active:scale-[0.98] transition duration-200"
  >
    Enviar
  </button>
</form>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
